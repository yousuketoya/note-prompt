<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>note専用プロンプト</title>

    <!-- ファビコン・Webアイコン設定 -->
    <link rel="icon" href="./icon.png" type="image/png">
    <link rel="apple-touch-icon" href="./icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Gen AI SDK -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>

<body class="bg-slate-50 h-screen flex flex-col">

    <!-- ヘッダー -->
    <header
        class="bg-emerald-600 text-white p-4 shadow-md flex justify-between items-center max-w-3xl w-full mx-auto rounded-b-xl">
        <div class="flex items-center gap-2">
            <img src="./icon.png" alt="Icon" class="w-7 h-7 rounded-lg object-cover border border-emerald-400">
            <h1 class="font-bold text-lg">note専用プロンプト</h1>
        </div>
        <button id="open-settings"
            class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
            ⚙️ APIキー設定
        </button>
    </header>

    <!-- チャットメッセージ表示エリア -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 max-w-3xl w-full mx-auto space-y-4">
        <!-- 初期メッセージ -->
        <div class="flex items-start space-x-3">
            <div class="flex flex-col items-center flex-shrink-0">
                <img src="./icon.png" alt="AI" class="w-8 h-8 rounded-full border border-emerald-300 object-cover">
                <span class="text-[10px] font-bold text-emerald-600 mt-0.5">AI</span>
            </div>
            <div
                class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 text-slate-800 max-w-lg leading-relaxed text-sm">
                こんにちは！noteで読者の目を引き、最後まで読まれて「スキ」やコメントが届く、プロンプトを一緒に作成します✨<br><br>
                まずは、どのようなテーマや内容でnote記事を書きたいか教えてください！
            </div>
        </div>
    </main>

    <!-- 入力エリア -->
    <footer class="bg-white border-t border-slate-200 p-4 shadow-lg">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="回答を入力してください..."
                class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
                autocomplete="off" required>
            <button type="submit"
                class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-medium transition-colors text-sm">
                送信
            </button>
        </form>
    </footer>

    <!-- APIキー設定モーダル -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl">
            <div class="flex items-center gap-2 mb-2">
                <img src="./icon.png" alt="Icon" class="w-6 h-6 rounded-md">
                <h2 class="text-lg font-bold text-slate-800">Gemini APIキーの設定</h2>
            </div>
            <p class="text-xs text-slate-500 mb-4">入力されたAPIキーはブラウザのローカルストレージにのみ保存され、外部サーバーには送信されません。</p>
            <input type="password" id="api-key-input" placeholder="AIzaSy..."
                class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
            <div class="flex justify-end gap-2">
                <button id="close-settings"
                    class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm transition-colors">
                    キャンセル
                </button>
                <button id="save-api-key"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm transition-colors">
                    保存する
                </button>
            </div>
        </div>
    </div>

    <!-- スクリプト -->
    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const systemInstruction = `
あなたは「noteでフォロワーを惹きつけるプロのWeb編集者／プロンプトエンジニア」です。
ユーザーと対話しながら、note.comで読まれ、「スキ」やコメントが届く最高の『鈴木式プロンプト』を作成してください。

【ヒアリング・情報収集の流れ】
最初から一気に聞かず、対話形式で以下の情報を1〜2問ずつ深掘りして確認してください：
1. 【対象】読者の悩み、現在の感情状態、読了後の変化
2. 【依頼内容】テーマ、伝えたい気づき/メッセージ、実体験エピソード
3. 【役割・キャラクター】語り手の雰囲気や文体（トーン＆マナー）

【最終プロンプトの出力条件】
ユーザーから必要な情報が十分に揃ったら、会話の最後に必ず以下の【命令書】フォーマットに完全に落とし込んだプロンプトを出力してください。

【出力フォーマット】
【命令書】
あなたは「noteでフォロワーを惹きつけるプロのWebライター／編集者」として行動してください。
以下の手順・制約・目的に基づき、思わずクリックしたくなり、最後まで読まれ、「スキ」やコメントが届く最高のnote記事（または構成案）を作成してください。

1.【目的】
・思わずクリックしたくなる魅惑的な「タイトル案（5選）」の作成
・途中で離脱されず完読される「記事本文」の作成
・読者が「スキ」を押しやすくなり、コメントを残したくなる「末尾の問いかけ／まとめ」の設定

2.【対象（ターゲット読者）】
・どんな悩みを抱えている人か：（入力内容を反映）
・読者の現在の感情・状態：（入力内容を反映）
・読了後にどうなってほしいか：（入力内容を反映）

3.【依頼内容】
以下のテーマ・エピソードをもとに、note記事を作成してください。
・記事のテーマ：（入力内容を反映）
・込めて伝えたい想い・気づき：（入力内容を反映）
・入れるべき具体例や実体験：（入力内容を反映）

4.【役割・キャラクター設定】
・語り手の雰囲気／語尾・トーン：（入力内容を反映）
・視点：一人称は「私（僕）」とし、読者への呼びかけを意識する

5.【形式・追加要件】
①タイトル：感情を動かすキーワードを含め、30文字程度で5案提示する
②導入文（フック）：最初の3行で「自分のことだ」と思わせる共感・問題提起を入れる
③目次・見出し：H2・H3見出しを活用し、テンポよく読める長さに章立てする
④ストーリー構成：【体験談・失敗談】→【そこからの気づき】→【読者への応用・提案】の流れるような展開にする
⑤読後感・エンゲージメント促進：
 ・読んだあとに温かい気持ちや前向きな変化が残る文章にする
 ・記事の最後に、読者がコメントしやすくなるような「一言の問いかけ」を入れる

6.【参考やヒント】
・入れ込みたいキーワード：（主要キーワード）

7.【レビュー＆改善要請】
回答を出力する前に、もし提示された情報だけでは最高のnote記事を書くのに不足している（より魅力的なエピソードが引き出せそう等）と判断した場合は、追加で1〜3つの質問を私に投げかけてください。
`;

        // DOM要素
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings');
        const closeSettingsBtn = document.getElementById('close-settings');
        const saveApiKeyBtn = document.getElementById('save-api-key');
        const apiKeyInput = document.getElementById('api-key-input');

        let currentApiKey = localStorage.getItem('gemini_api_key') || '';

        if (!currentApiKey) {
            settingsModal.classList.remove('hidden');
        }

        openSettingsBtn.addEventListener('click', () => {
            apiKeyInput.value = currentApiKey;
            settingsModal.classList.remove('hidden');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        saveApiKeyBtn.addEventListener('click', () => {
            const newKey = apiKeyInput.value.trim();
            if (!newKey) {
                alert('APIキーを入力してください。');
                return;
            }
            localStorage.setItem('gemini_api_key', newKey);
            currentApiKey = newKey;
            settingsModal.classList.add('hidden');
            alert('APIキーを保存しました！');
        });

        function getChatSession() {
            if (!currentApiKey) return null;
            const ai = new GoogleGenAI({ apiKey: currentApiKey });
            return ai.chats.create({
                model: 'gemini-2.5-flash',
                config: { systemInstruction: systemInstruction }
            });
        }

        let chat = getChatSession();

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentApiKey) {
                alert('まずは右上の「APIキー設定」からGemini APIキーを設定してください。');
                settingsModal.classList.remove('hidden');
                return;
            }

            if (!chat) {
                chat = getChatSession();
            }

            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = appendLoading();
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const result = await chat.sendMessage({ message: message });
                const replyText = result.text;

                document.getElementById(loadingId).remove();
                appendMessage(replyText, 'ai');

            } catch (error) {
                console.error(error);
                document.getElementById(loadingId).remove();
                appendMessage('エラーが発生しました。APIキーが正しいか確認してください。', 'ai');
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'justify-end' : ''}`;

            if (!isUser) {
                const isPrompt = text.includes('【命令書】');

                if (isPrompt) {
                    const promptIndex = text.indexOf('【命令書】');
                    const introText = text.substring(0, promptIndex).trim();
                    const promptText = text.substring(promptIndex).trim();
                    const promptId = 'prompt-' + Date.now();

                    let htmlContent = '';
                    if (introText) {
                        htmlContent += `<div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 text-slate-800 max-w-lg whitespace-pre-wrap text-sm mb-3">${escapeHTML(introText)}</div>`;
                    }

                    htmlContent += `
                        <div class="bg-slate-800 text-slate-100 p-4 rounded-2xl shadow-md border border-slate-700 max-w-xl w-full relative">
                            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-700">
                                <span class="text-xs font-semibold text-emerald-400">作成されたnote専用プロンプト</span>
                                <button onclick="copyPrompt('${promptId}', this)" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded transition-colors flex items-center gap-1 font-bold">
                                    📋 全文コピー
                                </button>
                            </div>
                            <pre id="${promptId}" class="whitespace-pre-wrap font-sans text-xs sm:text-sm leading-relaxed">${escapeHTML(promptText)}</pre>
                        </div>
                    `;

                    wrapper.innerHTML = `
                        <div class="flex flex-col items-center flex-shrink-0">
                            <img src="./icon.png" alt="AI" class="w-8 h-8 rounded-full border border-emerald-300 object-cover">
                            <span class="text-[10px] font-bold text-emerald-600 mt-0.5">AI</span>
                        </div>
                        <div class="max-w-xl w-full">${htmlContent}</div>
                    `;
                } else {
                    wrapper.innerHTML = `
                        <div class="flex flex-col items-center flex-shrink-0">
                            <img src="./icon.png" alt="AI" class="w-8 h-8 rounded-full border border-emerald-300 object-cover">
                            <span class="text-[10px] font-bold text-emerald-600 mt-0.5">AI</span>
                        </div>
                        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 text-slate-800 max-w-lg whitespace-pre-wrap text-sm leading-relaxed">${escapeHTML(text)}</div>
                    `;
                }
            } else {
                wrapper.innerHTML = `
                    <div class="bg-emerald-600 text-white p-3.5 rounded-2xl shadow-sm max-w-lg whitespace-pre-wrap text-sm leading-relaxed">${escapeHTML(text)}</div>
                    <div class="flex flex-col items-center flex-shrink-0">
                        <div class="bg-slate-700 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs">You</div>
                        <span class="text-[10px] font-bold text-slate-500 mt-0.5">You</span>
                    </div>
                `;
            }
            chatContainer.appendChild(wrapper);
        }

        function appendLoading() {
            const id = 'loading-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = `flex items-start space-x-3`;
            wrapper.innerHTML = `
                <div class="flex flex-col items-center flex-shrink-0">
                    <img src="./icon.png" alt="AI" class="w-8 h-8 rounded-full border border-emerald-300 object-cover">
                    <span class="text-[10px] font-bold text-emerald-600 mt-0.5">AI</span>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 text-slate-500 text-sm italic">プロンプトを考案中...</div>
            `;
            chatContainer.appendChild(wrapper);
            return id;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.copyPrompt = function (elementId, btnElement) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = '✅ コピー完了！';
                btnElement.classList.replace('bg-emerald-600', 'bg-teal-600');

                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.classList.replace('bg-teal-600', 'bg-emerald-600');
                }, 2000);
            }).catch(() => {
                alert('コピーに失敗しました。');
            });
        };
    </script>
</body>

</html>
